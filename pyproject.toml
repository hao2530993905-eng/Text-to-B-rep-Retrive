[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "text2cad-retrieval"
version = "0.2.0"
description = "Text-to-CAD retrieval with spectral descriptors and Qwen3-Embedding LoRA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cadquery-ocp>=7.7",
  "numpy>=1.26",
  "pandas>=2.0",
  "pyarrow>=16",
  "scipy>=1.11",
  "torch>=2.4",
  "transformers>=4.51",
  "peft>=0.15",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.scripts]
cadret = "cadret.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F", "I"]
