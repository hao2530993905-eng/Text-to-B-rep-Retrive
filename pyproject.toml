[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cadret"
version = "0.1.0"
description = "Spectral descriptor learning for text-to-CAD retrieval"
requires-python = ">=3.10"
dependencies = ["torch", "transformers", "peft", "numpy", "scipy", "pandas", "tqdm"]

[project.scripts]
cadret = "cadret.cli:main"

[project.optional-dependencies]
dev = ["ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F", "I"]
